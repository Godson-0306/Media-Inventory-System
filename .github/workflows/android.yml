name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install Capacitor
        working-directory: mobile
        run: npm ci

      - name: Sync Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Keep location permissions
        working-directory: mobile
        run: node scripts/ensure-android-permissions.mjs

      - name: Build release APK
        working-directory: mobile/android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publish APK to the website
        run: |
          mkdir -p public/downloads
          APK=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" public/downloads/asset-operations.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/asset-operations.apk
          if git diff --staged --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish the Android APK for website download."
            git push
          fi
